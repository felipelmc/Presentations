title: Plenário Slides
author: Felipe Lamarca
version: 0.1.0
quarto-required: ">=1.9.0"
contributes:
  formats:
    revealjs:
      theme: [theme/plenario.scss, theme/componentes.scss]
      template-partials:
        - partials/title-slide.html
      filters:
        - path: plenario.lua
          at: pre-ast
      width: 1280
      height: 720
      margin: 0.06
      center: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      slide-number: c/t
      show-slide-number: all
      hash-type: number
      controls: true
      progress: true
      menu: false
      lang: pt-BR
      date-format: "D [de] MMMM [de] YYYY"
      csl: csl/abnt.csl
      citations-hover: true
      link-citations: true
      echo: false
      fig-align: center
      fig-dpi: 150
      syntax-highlighting: a11y
      html-math-method: mathjax
      language:
        section-title-references: "Referências"

name: Publicar

# Renderiza os decks revealjs, gera os PDFs com o decktape e a galeria (palestras.yml),
# e publica no GitHub Pages (modo "GitHub Actions"):
#   gh api -X POST repos/<dono>/<repo>/pages -f build_type=workflow
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sem_pdf:
        description: "Publicar sem gerar PDFs (PLENARIO_PDF=0)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PLENARIO_PDF: ${{ inputs.sem_pdf && '0' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.35

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dependências (PyYAML, fontes de emoji, poppler)
        run: |
          pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji poppler-utils
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      # Se algum deck passar a usar webR, instale aqui (não é versionado):
      # - run: quarto add coatless/quarto-webr@0.4.3 --no-prompt

      - uses: actions/cache@v6
        with:
          path: .quarto/plenario-pdf
          key: plenario-pdf-${{ github.sha }}
          restore-keys: plenario-pdf-

      - name: Checagens antes do render
        run: python3 _extensions/felipelmc/plenario/tools/check.py pre

      - name: Renderizar
        run: |
          set -o pipefail
          quarto render 2>&1 | tee render.log

      - name: Checagens depois do render
        run: python3 _extensions/felipelmc/plenario/tools/check.py post _site render.log

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
